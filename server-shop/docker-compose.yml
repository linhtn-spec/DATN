services:
  # MongoDB Primary Node - build từ custom Dockerfile
  mongo-primary:
    image: mongo:7.0
    container_name: mongo-primary
    init: true
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shop
    volumes:
      - mongo_primary_data:/data/db
      - mongo_primary_config:/data/configdb
    networks:
      - shop-server
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]

  # MongoDB Secondary Nodes - sử dụng image thường
  mongo-secondary1:
    image: mongo:7.0
    container_name: mongo-secondary1
    init: true
    restart: always
    environment:
      MONGO_INITDB_DATABASE: shop
    ports:
      - "27018:27017"
    volumes:
      - mongo_secondary1_data:/data/db
      - mongo_secondary1_config:/data/configdb
    networks:
      - shop-server
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    # Healthcheck disabled to prevent blocking startup
    # healthcheck:
    #   test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 120s

  mongo-secondary2:
    image: mongo:7.0
    container_name: mongo-secondary2
    init: true
    restart: always
    environment:
      MONGO_INITDB_DATABASE: shop
    ports:
      - "27019:27017"
    volumes:
      - mongo_secondary2_data:/data/db
      - mongo_secondary2_config:/data/configdb
    networks:
      - shop-server
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    # Healthcheck disabled to prevent blocking startup
    # healthcheck:
    #   test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 120s

  mongo-arbiter:
    image: mongo:7.0
    container_name: mongo-arbiter
    init: true
    restart: always
    environment:
      MONGO_INITDB_DATABASE: shop
    ports:
      - "27020:27017"
    volumes:
      - mongo_arbiter_data:/data/db
      - mongo_arbiter_config:/data/configdb
    networks:
      - shop-server
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    # Healthcheck disabled to prevent blocking startup
    # healthcheck:
    #   test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 120s

  # Service để khởi tạo replica set - chạy sau khi tất cả nodes sẵn sàng
  mongo-setup:
    image: mongo:7.0
    container_name: mongo-setup
    init: true
    networks:
      - shop-server
    depends_on:
      mongo-primary:
        condition: service_started
    volumes:
      - ./.docker/db/init:/scripts
    command: >
      bash -c "
        echo 'Đợi tất cả MongoDB nodes sẵn sàng...'
        sleep 20
        echo 'Bắt đầu khởi tạo replica set...'
        mongosh --host mongo-primary:27017 --file /scripts/init-replica.js
        echo 'Hoàn thành khởi tạo replica set'
      "
    restart: on-failure # Tiếp tục thử lại nếu nodes chưa sẵn sàng

  elasticsearch:
    container_name: es-container
    image: docker.elastic.co/elasticsearch/elasticsearch:7.11.0
    environment:
      - xpack.security.enabled=false
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - shop-server
    volumes:
      - ./.docker/elasticsearch/data:/usr/share/elasticsearch/data
      - ./.docker/elasticsearch/logs:/usr/share/elasticsearch/logs
    ports:
      - 9200:9200
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kibana:
    container_name: kb-container
    image: docker.elastic.co/kibana/kibana:7.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://es-container:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    networks:
      - shop-server
    depends_on:
      elasticsearch:
        condition: service_started
    ports:
      - 5601:5601
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  monstache:
    image: rwynn/monstache:6.7.22
    container_name: monstache-container
    init: true
    restart: unless-stopped
    networks:
      - shop-server
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
    volumes:
      - .docker/monstache/config.toml:/config.toml:ro
      - .docker/monstache/plugins:/plugins:ro
    command: -f /config.toml
    healthcheck:
      test: [ "CMD-SHELL", "pgrep monstache > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    init: true
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      SERVER_PORT: "5000"
      URL_DB: mongodb://mongo-primary:27017,mongo-secondary1:27017,mongo-secondary2:27017/shop?replicaSet=rs0
      ELASTICSEARCH_HOST: http://es-container:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-key}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-your-access-token-secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-your-refresh-token-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${CLIENT_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_APIKEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_APISECRET}
      MAIL_HOST: ${NODEMAILER_HOST}
      MAIL_PORT: ${NODEMAILER_PORT}
      MAIL_USER: ${NODEMAILER_EMAIL}
      MAIL_PASSWORD: ${NODEMAILER_PASSWORD}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      VNPAY_TMNCODE: ${VNP_TMNCODE}
      VNPAY_HASHSECRET: ${VNP_HASH_SECRET}
      # CORS whitelist — must match the origin the browser sends (Nginx port 80)
      WHITE_URL_1: ${WHITE_URL_1:-http://localhost}
      WHITE_URL_2: ${WHITE_URL_2:-http://localhost:80}
    networks:
      - shop-server
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/}
      VITE_SOCKET_ENDPOINT: ${VITE_SOCKET_ENDPOINT:-http://localhost}
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost}
      VITE_ENV: ${VITE_ENV:-production}
    networks:
      - shop-server
    depends_on:
      - backend

volumes:
  mongo_primary_data:
  mongo_primary_config:
  mongo_secondary1_data:
  mongo_secondary1_config:
  mongo_secondary2_data:
  mongo_secondary2_config:
  mongo_arbiter_data:
  mongo_arbiter_config:
  backend_node_modules:


networks:
  shop-server:
    driver: bridge
